{% extends 'home/base.html' %}

{% block title %}Login — Grocery Online{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="container">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:20px;">
        <div style="font-size:3rem;">🔐</div>
      </div>
      <h2>Welcome Back!</h2>
      <p class="subtitle">Login to continue shopping fresh groceries.</p>

      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Your username" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div style="position:relative;">
            <input type="password" id="password" name="password" class="form-control" placeholder="Your password" required>
            <button type="button" class="toggle-password" data-target="password"
              style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;">
              <i class="fa fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn w-100" style="justify-content:center;margin-top:8px;">
          <i class="fa fa-sign-in-alt"></i> Login
        </button>
      </form>

      <!-- Divider -->
      <div style="display:flex; align-items:center; margin:20px 0; text-align:center; color:var(--text-muted); font-size:0.88rem;">
        <hr style="flex:1; border:none; border-top:1px solid var(--gray-light);">
        <span style="padding:0 10px;">or</span>
        <hr style="flex:1; border:none; border-top:1px solid var(--gray-light);">
      </div>

      <!-- Google Sign In Button Container -->
      <div style="display: flex; justify-content: center; margin-top: 10px;">
        <div id="g_id_onload"
             data-client_id="{{ google_client_id }}"
             data-context="signin"
             data-ux_mode="redirect"
             data-login_uri="{{ request.scheme }}://{{ request.get_host }}{% url 'google_callback' %}"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-shape="pill"
             data-theme="outline"
             data-text="continue_with"
             data-size="large"
             data-logo_alignment="left"
             data-width="300">
        </div>
      </div>

      <div class="auth-link" style="margin-top:20px;">
        Don't have an account? <a href="{% url 'register' %}">Register here</a>
      </div>
    </div>
  </div>
</section>

{% block extra_js %}
<script src="https://accounts.google.com/gsi/client" async defer></script>
{% endblock %}
{% endblock %}
